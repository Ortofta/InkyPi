<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Electricity Prices</title>
  <link rel="stylesheet" href="electricity_price.css">
</head>
<body>
  {# debug block removed - now rendering chart only #}
  <div class="chart-container">
    <div class="date-label">
      Elpriser - {{ current_date }} ({{ zone }})
    </div>
    <canvas id="priceChart" width="{{ width }}" height="{{ height }}"></canvas>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.2.1"></script>
  <script>
    // Build arrays directly from template JSON to avoid runtime parsing differences
    const sekPrices = {{ data | map(attribute='SEK_per_kWh') | list | tojson }};
    const times = {{ data | map(attribute='time_start') | list | tojson }};

    // Ensure numbers
    for (let i = 0; i < sekPrices.length; i++) {
      sekPrices[i] = Number(sekPrices[i]);
    }

    const labels = times.map(t => t.slice(11, 16));
    const maxPrice = Math.max(...sekPrices);
    const maxPriceIndex = sekPrices.indexOf(maxPrice);
    const maxPriceTime = labels[maxPriceIndex];

    const ctx = document.getElementById('priceChart').getContext('2d');
    const priceChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'SEK per kWh',
          data: sekPrices,
          borderColor: 'rgba(0, 0, 0, 1)',
          backgroundColor: 'rgba(128, 128, 128, 0.5)',
          fill: true,
          tension: 0.3,
          pointBackgroundColor: function(context) {
            const index = context.dataIndex;
            return index === maxPriceIndex ? 'rgba(255, 0, 0, 1)' : 'rgba(0, 0, 0, 1)';
          },
          pointRadius: function(context) {
            const index = context.dataIndex;
            return index === maxPriceIndex ? 5 : 0;
          },
          pointBorderWidth: function(context) {
            const index = context.dataIndex;
            return index === maxPriceIndex ? 2 : 0;
          }
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            display: true,
            position: 'top',
            labels: {
              color: '#000000',
              font: { size: 12, weight: '700' }
            }
          },
          title: {
            display: false,
            text: maxPrice,
            color: '#000000',
            font: { size: 14, weight: '700' }
          },
          annotation: {
            annotations: {
              maxPriceAnnotation: {
                type: 'label',
                xValue: maxPriceTime,
                yValue: maxPrice,
                content: ['Högsta pris:', maxPrice.toFixed(2) + ' SEK/kWh'],
                position: 'bottom',
                yAdjust: 15,
                backgroundColor: 'rgba(255, 0, 0, 0.8)',
                color: '#FFFFFF',
                font: {
                  size: 10,
                  weight: 'bold'
                },
                padding: {
                  top: 4,
                  bottom: 4,
                  left: 8,
                  right: 8
                },
                borderRadius: 4
              }
            }
          }
        },
        scales: {
          x: {
            title: { display: true, text: 'Time', color: '#000000', font: { size: 12, weight: '700' } },
            ticks: { color: '#000000', font: { size: 11, weight: '600' } },
            grid: { color: 'rgba(0,0,0,0.08)', borderColor: 'rgba(0,0,0,0.8)' }
          },
          y: {
            title: { display: true, text: 'SEK/kWh', color: '#000000', font: { size: 12, weight: '700' } },
            beginAtZero: false,
            suggestedMax: maxPrice,
            ticks: { color: '#000000', font: { size: 11, weight: '600' }, stepSize: 0.1 },
            grid: { color: 'rgba(0,0,0,0.08)', borderColor: 'rgba(0,0,0,0.8)' }
          }
        }
      },
      plugins: [{
        id: 'annotation',
        beforeDraw: function(chart) {
          const ctx = chart.ctx;
          const meta = chart.getDatasetMeta(0);
          const point = meta.data[maxPriceIndex];
          
          if (point) {
            const x = point.x;
            const y = point.y;
            
            // Draw a small circle around the point
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';
            ctx.fill();
            ctx.restore();
          }
        }
      }]
    });
  </script>
</body>
</html>
